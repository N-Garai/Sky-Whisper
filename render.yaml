services:
  - type: web
    name: skywhisper
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && cd src/frontend && npm ci && npm run build && cd ../backend/mastra && npm ci && npm run build
    startCommand: uvicorn src.backend.api.routes:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: NODE_VERSION
        value: "20"
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVEN_VOICE_ID
        sync: false
      # LLM_PROVIDER / GEMMA_API_KEY are set in the Render dashboard (sync: false).
      # The template narrator is the automatic fallback if the model call fails.
      - key: LLM_PROVIDER
        sync: false
      - key: GEMMA_API_KEY
        sync: false
      - key: GEMMA3_MODEL
        sync: false
      - key: GEMMA4_MODEL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        sync: false
      - key: SKYWHISPER_EPHEMERIS
        value: de421.bsp
